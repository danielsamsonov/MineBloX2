name: Build MineBloX

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle
        run: gradle --no-daemon --stacktrace clean jar

      - name: Verify JAR
        run: |
          test -f build/libs/MineBloX-0.2.0.jar
          jar tf build/libs/MineBloX-0.2.0.jar | grep -q "plugin.yml"
          jar tf build/libs/MineBloX-0.2.0.jar | grep -q "com/mineblox/core/MineBloXPlugin.class"

      - name: Upload MineBloX JAR
        uses: actions/upload-artifact@v4
        with:
          name: MineBloX-plugin
          path: build/libs/MineBloX-0.2.0.jar
          if-no-files-found: error
