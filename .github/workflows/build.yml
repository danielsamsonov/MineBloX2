name: Build MineBloX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -ntp clean package
      - name: Upload MineBloX JAR
        uses: actions/upload-artifact@v4
        with:
          name: MineBloX-plugin
          path: target/*.jar
          if-no-files-found: error
